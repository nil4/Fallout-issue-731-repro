name: Build
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: "Build with Fallout"
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: build.sh
      run: |
        ./build.sh
